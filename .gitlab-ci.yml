# Runs the tests, then builds the server image and publishes it to this project's
# GitLab Container Registry ($CI_REGISTRY_IMAGE). The image is only built when the
# tests pass. Merge requests only build; the default branch
# publishes :latest, :<short sha> and :dev-<short sha>-<unix time> (sortable, for
# Flux image automation), and tags publish :<tag>.

stages: [test, build]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# The API and browser tests (test/run.mjs) against a demo-mode server, with
# Chromium for the browser tests. TEST_BROWSER=1 makes a missing browser a
# failure instead of a skip.
test:
  stage: test
  image: node:26
  variables:
    TEST_BROWSER: "1"
    CHROME_BIN: /usr/bin/chromium
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium fonts-dejavu-core >/dev/null
  script:
    - npm test

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    PLATFORMS: linux/amd64,linux/arm64
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create builder-ctx
    - docker buildx create --use --name builder builder-ctx
  script:
    - |
      set -eu
      push=false
      tags="-t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        push=true
        tags="$tags -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      elif [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        push=true
        # dev-<sha>-<unix time>: sortable, for Flux image automation (ImagePolicy picks the newest)
        tags="$tags -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA-$(date +%s)"
      fi
      if [ "$push" = true ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi
      docker buildx build \
        --platform "$PLATFORMS" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        $tags \
        --push="$push" \
        .
